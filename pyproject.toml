[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-risk-lab"
version = "0.1.0"
description = "European option valuation, 3D Greeks, portfolio P&L explain and delta hedge analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
docs = ["matplotlib>=3.9,<4"]
app = ["streamlit>=1.50,<2", "plotly>=5.24,<7", "pandas>=2.2,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "scipy>=1.14,<2", "ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1.2,<2"]

[project.scripts]
derivatives-demo = "derivatives_lab.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=derivatives_lab --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
